[package]
name            = "micafp-unified-shield-daemon"
version         = "9.0.0-enterprise"
edition         = "2021"
authors         = ["MICAFP UnifiedShield Quantum-Ultra Contributors"]
description     = "MICAFP-UnifiedShield Enterprise v9.0 — Complete merge of all 13 source projects. Zero features removed."
license         = "GPL-3.0-or-later"
repository      = "https://github.com/micafp/UnifiedShield-vip-ultra-Quantum-ultra"
readme          = "README.md"
keywords        = ["vpn", "anti-censorship", "iran", "privacy", "post-quantum"]
categories      = ["network-programming", "cryptography"]

[dependencies]
# ── Async runtime ──────────────────────────────────────────────────────────
tokio            = { version = "1", features = ["full"] }
tokio-util       = { version = "0.7", features = ["compat", "rt"] }
tokio-stream     = { version = "0.1", features = ["sync", "net"] }
futures          = "0.3"
async-trait      = "0.1"
pin-project-lite = "0.2"
flume            = "0.11"
crossbeam-channel = "0.5"

# ── Cryptography: classical ────────────────────────────────────────────────
x25519-dalek = { version = "2.0", features = ["serde", "static_secrets"] }
ed25519-dalek = { version = "2.0", features = ["zeroize", "rand_core"] }
curve25519-dalek = { version = "4.0", features = ["serde"] }
hkdf             = "0.12"
sha2             = "0.10"
hmac             = "0.12"
blake3           = "1"
aes-gcm          = "0.10"
chacha20poly1305 = "0.10"
ring             = "0.17"
rand             = { version = "0.8", features = ["small_rng", "std_rng"] }
rand_core        = { version = "0.6", features = ["std"] }
rand_distr       = "0.4"
zeroize          = { version = "1", features = ["derive", "aarch64"] }
rcgen            = "0.13"

# ── Cryptography: post-quantum ─────────────────────────────────────────────
ml-kem           = { version = "0.2", package = "ml-kem", features = ["deterministic", "zeroize"] }

# ── TLS / QUIC ─────────────────────────────────────────────────────────────
rustls           = { version = "0.23", features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.7"
rustls-pemfile   = "2.1"
webpki-roots     = "0.26"
tokio-rustls     = "0.26"
quinn            = "0.11"
quinn-proto      = "0.11"

# ── HTTP / WebSocket ───────────────────────────────────────────────────────
hyper            = { version = "1", features = ["full"] }
hyper-util       = { version = "0.1", features = ["tokio"] }
http-body-util   = "0.1"
h2               = "0.4"
reqwest          = { version = "0.12", features = [
    "json", "rustls-tls", "stream", "socks",
], default-features = false }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
url              = "2"

# ── Serialization ──────────────────────────────────────────────────────────
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
bincode          = "1"
prost            = "0.13"
prost-types      = "0.13"
toml             = "0.8"

# ── Observability / Tracing ────────────────────────────────────────────────
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter", "json", "fmt", "time", "registry",
] }
tracing-appender = "0.2"

# ── Error handling ─────────────────────────────────────────────────────────
anyhow           = "1"
thiserror        = "2"

# ── Memory security ────────────────────────────────────────────────────────
libc             = "0.2"
memsec           = "0.7"

# ── AI / ML inference ─────────────────────────────────────────────────────
ort              = { version = "2.0.0-rc.12", features = ["load-dynamic"], optional = true }
ndarray          = "0.16"

# ── On-device LLM (§10.1 Shield AI Assistant) ──────────────────────────────
# llama-cpp-2 wraps llama.cpp GGUF inference. Optional because the build needs
# CMake + a C/C++ toolchain on the host. Default-off; enable with the
# `ai-assistant` feature. When the feature is off, the assistant transparently
# falls back to a keyword rule-based responder (still fully functional).
#
# NOTE on version: directive §10.1 specified `0.2` but crates.io only publishes
# llama-cpp-2 at 0.1.x. Using `0.1` — the API surface used by the assistant
# is stable across 0.1.x.
llama-cpp-2      = { version = "0.1", optional = true }

# ── Networking ─────────────────────────────────────────────────────────────
socket2          = { version = "0.5", features = ["all"] }
dns-lookup       = "2"
trust-dns-resolver = "0.23.2"
ipnet            = "2"

# ── MQTT ───────────────────────────────────────────────────────────────────
rumqttc          = "0.24"

# ── Tunnel / TUN interface ────────────────────────────────────────────────
tun              = { version = "0.6", features = ["async"], optional = true }
boringtun        = "0.7"

# ── Platform / system ─────────────────────────────────────────────────────
dirs             = "5"
chrono           = { version = "0.4", features = ["serde"] }
once_cell        = "1"
parking_lot      = { version = "0.12", features = ["deadlock_detection", "serde"] }
dashmap          = "6"
arc-swap         = "1"
cfg-if           = "1"
bitflags         = "2"
strum            = { version = "0.26", features = ["derive"] }
walkdir          = "2"

# ── P2P ───────────────────────────────────────────────────────────────────
libp2p           = { version = "0.53", features = [
    "tokio", "gossipsub", "mdns", "kad", "relay", "dcutr",
    "noise", "tcp", "quic", "websocket", "yamux", "identify",
    "ping", "autonat", "macros", "dns",
] }

# ── Free-tier VPN platform integration (§9) ────────────────────────────────
# arti (pure-Rust Tor) + arti-client for Tor+Snowflake core. Heavy dep tree
# (~30 MB compiled, pulls in tor-circust, tor-proto, tor-netdir, tor-llcrypto)
# so it's gated behind the `free-tier-tor` cargo feature; without the feature
# the tor_snowflake.rs core compiles + runs in stub mode (logging-only) so
# CI sandboxes without the heavy arti tree remain green.
#
# NOTE on versions: directive §9 specifies `arti = "0.21"` and
# `arti-client = "0.21"` but crates.io does not publish either at 0.21 —
# `arti` is at 2.x (umbrella binary meta-crate), `arti-client` is at 0.45
# (the actual client library API). We use the real crates.io versions.
arti             = { version = "2.5", optional = true }
arti-client      = { version = "0.45", optional = true }

# ── Misc ──────────────────────────────────────────────────────────────────
bytes            = "1"
hex              = "0.4"
base64           = "0.22"
uuid             = { version = "1", features = ["v4"] }
sha1             = "0.10"
sha3             = "0.10"
futures-util     = "0.3"
clap             = { version = "4", features = ["derive", "env"] }

# ── Unix / Linux ──────────────────────────────────────────────────────────
[target.'cfg(unix)'.dependencies]
nix              = { version = "0.29", features = ["signal", "net", "ioctl", "fs"] }
signal-hook      = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }

# ── Windows ───────────────────────────────────────────────────────────────
[target.'cfg(windows)'.dependencies]
windows-sys      = { version = "0.59", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Services",
    "Win32_System_IO",
] }

# ── Android JNI ───────────────────────────────────────────────────────────
[target.'cfg(target_os = "android")'.dependencies]
jni              = "0.21"

[build-dependencies]
prost-build = "0.13"
cc          = "1"
serde_json  = "1"

[dev-dependencies]
tempfile  = "3"
criterion = "0.5"

[features]
default = ["platform-linux"]

# ── Platform features ─────────────────────────────────────────────────────
platform-linux   = ["tun"]
platform-android = ["tun"]
platform-windows = []
platform-ios     = []
platform-openwrt = ["tun"]

# ── Capability features ───────────────────────────────────────────────────
ai-inference       = ["ort"]
# §10.1 on-device LLM assistant (Llama 3.2 1B GGUF). Disabled by default
# to keep cold-build times low; enable on hosts with CMake + a C++ compiler.
ai-assistant       = ["llama-cpp-2"]
userspace-tunnel   = ["tun"]
hardened-memory    = []
post-quantum       = []
quic-transport     = []
quantum-extensions = ["post-quantum"]
quantum-full       = ["post-quantum", "hardened-memory"]

# ── Free-tier VPN platform integration (§9) ────────────────────────────────
# `free-tier-tor` pulls in the heavy arti / arti-client crates and enables
# real Tor+Snowflake connectivity. Without it, tor_snowflake.rs runs in
# stub mode (logging-only) — keeps CI sandboxes green.
free-tier-tor         = ["dep:arti", "dep:arti-client"]
# `free-tier-psiphon-cgo` requires the libpsiphon.a cgo bridge to be linked.
free-tier-psiphon-cgo = []
# `free-tier-lantern-cgo` requires the liblantern.a cgo bridge to be linked.
free-tier-lantern-cgo = []
# Convenience bundle: enable all 3 free-tier integrations.
free-tier-all        = ["free-tier-tor", "free-tier-psiphon-cgo", "free-tier-lantern-cgo"]

# ── android-jni (for JNI bridge builds) ──────────────────────────────────
android-jni = []

# ── Bundle feature: everything ─────────────────────────────────────────────
full = [
    "platform-linux",
    "ai-inference",
    "ai-assistant",
    "userspace-tunnel",
    "hardened-memory",
    "post-quantum",
    "quic-transport",
    "quantum-extensions",
    "free-tier-all",
]

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true

[profile.release.package."*"]
opt-level = "z"

[profile.dev]
opt-level = 0
debug     = 2

[[bin]]
name = "shield-daemon"
path = "src/main.rs"

[lib]
name = "unifiedshield"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]
