# =============================================================================
# MICAFP-UnifiedShield-Enterprise (v9.0.0-enterprise)
# Censorship Simulation Environment — Iranian National Intranet Mock (nginx)
#
# Serves mock Persian content for:
#   - ap.shaparak.ir (Iranian national payment gateway — index.html)
#   - bmi.ir         (Bank Melli Iran — bmi.html)
#
# Container assignment:
#   docker-compose.yml `national-intranet-mock` service runs on the
#   `shield-net` bridge network with IPv4 address 10.202.0.10 (the simulated
#   Iranian national intranet IP). nginx listens on port 80 (default_server)
#   so the effective bind is 10.202.0.10:80 on the docker network.
#
# ─────────────────────────────────────────────────────────────────────────────
# IMPORTANT — docker-compose.yml mount path note
# ─────────────────────────────────────────────────────────────────────────────
# The directive specifies `root /etc/nginx/intranet-content;` (verbatim below).
# However, docker-compose.yml mounts the content volume at:
#     ./intranet-content:/usr/share/nginx/html:ro
# which is the nginx:alpine image's default html root.
#
# For the directive's verbatim config to serve content, EITHER:
#   (a) Update docker-compose.yml to mount at:
#         ./intranet-content:/etc/nginx/intranet-content:ro
#       (honors the directive's verbatim nginx config; RECOMMENDED), OR
#   (b) Update this file's `root` directive to:
#         root /usr/share/nginx/html;
#       (deviates from the directive's verbatim text but matches the
#        existing docker-compose.yml mount path).
#
# Option (a) is the smaller change and preserves the directive's intent.
# The orchestrator / next-step agent should choose one. Until then, this
# file uses the directive's verbatim text (option a).
# =============================================================================
#
# nginx -t validation:
#   This config requires nginx to be installed. To validate locally:
#     nginx -t -c /home/z/my-project/workspace/tests/censorship-simulation/nginx-intranet.conf
#   Note: nginx -t requires `error_log` paths to be writable, so if running
#   as a non-root user, /var/log/nginx/ must be writable (chmod or sudo).
#   In the docker image (nginx:alpine), these paths are pre-created by the
#   base image and nginx runs as the nginx user with appropriate perms.
# =============================================================================

server {
    listen 80 default_server;
    server_name ap.shaparak.ir bmi.ir *.shaparak.ir *.bmi.ir 10.202.0.10;
    root /etc/nginx/intranet-content;
    index index.html bmi.html;

    # Default UTF-8 charset for Persian content; set Content-Language for
    # accessibility.
    charset utf-8;
    add_header Content-Language fa;

    # Slightly more generous client_body_max for the (mock) payment form POSTs.
    client_max_body_size 2m;

    location / {
        try_files $uri $uri/ =404;
    }

    # Convenience route — `/bmi` serves bmi.html without changing the URL.
    # Used by tests that probe the intranet mock for the Bank Melli page.
    location /bmi {
        try_files /bmi.html =404;
    }

    # Convenience route — `/shaparak` serves index.html explicitly.
    location /shaparak {
        try_files /index.html =404;
    }

    # Healthcheck endpoint — returns 200 OK without logging noise.
    # (docker-compose.yml healthcheck uses `wget --spider -q http://localhost/`
    #  which hits this path by default.)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Hide nginx version from headers (security hygiene on the mock intranet).
    server_tokens off;

    access_log /var/log/nginx/intranet-access.log;
    error_log  /var/log/nginx/intranet-error.log;
}
